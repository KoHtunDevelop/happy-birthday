<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday! 🎂</title>
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            text-align: center;
        }

        /* စာအိတ် ပုံစံ */
        .envelope-container {
            cursor: pointer;
            transition: transform 0.3s ease;
            animation: bounce 1.5s infinite alternate;
        }
        .envelope-container:hover {
            transform: scale(1.1);
        }
        .envelope {
            background: #ff4081;
            width: 280px;
            height: 180px;
            position: relative;
            border-radius: 0 0 10px 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .envelope::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            border-left: 140px solid transparent;
            border-right: 140px solid transparent;
            border-top: 100px solid #e0356f;
            transform-origin: top;
            transition: transform 0.5s ease;
        }
        .envelope-text {
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            z-index: 2;
            margin-top: 40px;
        }

        /* ပွင့်လာမည့် မွေးနေ့ ကတ်ပြား */
        .card {
            display: none;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            max-width: 90%;
            width: 380px;
            backdrop-filter: blur(10px);
            animation: fadeIn 1s ease-in-out;
            position: absolute;
        }
        /* မွေးနေ့ရှင် ဓာတ်ပုံစတိုင် */
        .birthday-photo {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ff4081;
            margin-bottom: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        h1 {
            color: #ff4081;
            font-size: 2rem;
            margin-bottom: 10px;
        }
        p {
            color: #555;
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .audio-player {
            width: 100%;
            margin-top: 10px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }
    </style>
</head>
<body>

    <!-- ၁။ ပထမဦးဆုံးပေါ်နေမည့် စာအိတ်ပုံစံ -->
    <div class="envelope-container" id="envelopeBox" onclick="openEnvelope()">
        <div class="envelope">
            <div class="envelope-text">💌 နှိပ်၍ ဖွင့်ပါ</div>
        </div>
    </div>

    <!-- ၂။ စာအိတ်ကို နှိပ်လိုက်မှ ပေါ်လာမည့် မွေးနေ့ဆုတောင်းကတ်ပြား -->
    <div class="card" id="birthdayCard">
        <!-- မွေးနေ့ရှင် ဓာတ်ပုံ (photo.jpg နေရာတွင် သင်ထည့်လိုသည့် ပုံနာမည်ကို ပြောင်းပါ) -->
        <img src="photo.jpg" alt="Birthday Person" class="birthday-photo">
        
        <h1>Happy Birthday! 🎉</h1>
        
        <!-- မွေးနေ့ဆုတောင်းစာ -->
        <p>မွေးနေ့မှစ၍ နောင်နှစ်ပေါင်းများစွာတိုင် အပျော်ရွှင်ဆုံး၊ အအောင်မြင်ဆုံးနေ့ရက်များကို ပိုင်ဆိုင်နိုင်ပါစေကြောင်း ဆုမွန်ကောင်းတောင်းပေးလိုက်ပါတယ်ရှင်။ 🎈✨</p>
        
        <!-- Podcast သို့မဟုတ် သီချင်း အသံဖိုင် (audio.mp3 နေရာတွင် သင့်အသံဖိုင်နာမည်ထည့်ပါ) -->
        <audio class="audio-player" id="bdayAudio" controls>
            <source src="audio.mp3" type="audio/mp3">
            Your browser does not support the audio element.
        </audio>
    </div>

    <script>
        function openEnvelope() {
            // စာအိတ်ကို ဖျောက်မည်
            document.getElementById('envelopeBox').style.display = 'none';
            // မွေးနေ့ကတ်ပြားကို ပေါ်လာစေမည်
            document.getElementById('birthdayCard').style.display = 'block';
            
            // အသံဖိုင် (Podcast) အလိုအလျောက် စတင်ရန်
            var audio = document.getElementById('bdayAudio');
            audio.play().catch(error => {
                console.log("Audio autoplay restricted by browser, user can click play.");
            });

            // မီးရှူးမီးပန်းများ ပစ်ဖောက်မည်
            launchConfetti();
        }

        function launchConfetti() {
            var duration = 3 * 1000;
            var end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 5,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 }
                });
                confetti({
                    particleCount: 5,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 }
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }
    </script>
</body>
</html>
